<!-- Supabase Auth email template: "Change Email Address". Subject: Confirm your new Firstsend email -->
<div style="margin:0;padding:32px 16px;background:#f8f4ec;font-family:Helvetica,Arial,sans-serif;color:#1d1915">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#fdfbf7;border:1px solid #1d1915">
    <tr>
      <td style="padding:28px 28px 8px;font-family:Georgia,serif;font-size:22px">Firstsend</td>
    </tr>
    <tr>
      <td style="padding:16px 28px 8px">
        <h1 style="margin:0 0 12px;font-family:Georgia,serif;font-weight:400;font-size:30px;line-height:1.1">Confirm your new email</h1>
        <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#4a443d">You asked to change your Firstsend email to {{ .NewEmail }}. Click below to confirm.</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#f26a1b;color:#1d1915;text-decoration:none;font-weight:bold;font-size:16px;padding:14px 22px">Confirm new email &rarr;</a>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 28px 28px;font-size:13px;line-height:1.5;color:#6b645b">
        Didn't ask for this? Reply to support@firstsend.site and we'll secure your account.
      </td>
    </tr>
  </table>
</div>
