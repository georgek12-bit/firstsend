<!-- Supabase Auth email template: "Magic Link" and "Confirm signup". Subject: Your Firstsend sign-in link -->
<div style="margin:0;padding:32px 16px;background:#f8f4ec;font-family:Helvetica,Arial,sans-serif;color:#1d1915">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#fdfbf7;border:1px solid #1d1915">
    <tr>
      <td style="padding:28px 28px 8px">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="width:16px;height:16px;border:2px solid #1d1915;position:relative" valign="top"><div style="width:7px;height:7px;background:#f26a1b;margin:-2px -2px 0 auto"></div></td>
          <td style="padding-left:10px;font-family:Georgia,serif;font-size:22px">Firstsend</td>
        </tr></table>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 28px 8px">
        <h1 style="margin:0 0 12px;font-family:Georgia,serif;font-weight:400;font-size:30px;line-height:1.1">Your sign-in link</h1>
        <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#4a443d">Click the button to sign in to Firstsend. The link works once and expires in an hour.</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#f26a1b;color:#1d1915;text-decoration:none;font-weight:bold;font-size:16px;padding:14px 22px">Sign in to Firstsend &rarr;</a>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 28px 28px;font-size:13px;line-height:1.5;color:#6b645b">
        Didn't ask for this? You can ignore this email. Nobody can sign in without clicking the link.<br><br>
        Firstsend &middot; support@firstsend.site
      </td>
    </tr>
  </table>
</div>
